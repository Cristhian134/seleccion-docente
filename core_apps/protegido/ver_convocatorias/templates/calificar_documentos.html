<form method="post" class="contenido">
  <div class="cuadro_criterios">
    <div class="item__cuadro">
      <h3>Grados Académicos y Títulos Profesionales</h3>
      <input type="number" id="c1" min="0" max="10" oninput="validarYSumar()">
      <label for="c1" class="label__criterio">(0-10)</label>
    </div>
    <div class="item__cuadro">
      <h3>Investigación</h3>
      <input type="number" id="c2" min="0" max="10" oninput="validarYSumar()">
      <label for="c2" class="label__criterio">(0-10)</label>
    </div>
    <div class="item__cuadro">
      <h3>Enseñanza</h3>
      <input type="number" id="c3" min="0" max="10" oninput="validarYSumar()">
      <label for="c3" class="label__criterio">(0-10)</label>
    </div>
    <div class="item__cuadro">
      <h3>Capacitación Académica</h3>
      <input type="number" id="c4" min="0" max="5" oninput="validarYSumar()">
      <label for="c4" class="label__criterio">(0-5)</label>
    </div>
    <div class="item__cuadro">
      <h3>Proyección Social</h3>
      <input type="number" id="c5" min="0" max="5" oninput="validarYSumar()">
      <label for="c5" class="label__criterio">(0-5)</label>
    </div>
    <div class="item__cuadro">
      <h3>Ejercicio Profesional</h3>
      <input type="number" id="c6" min="0" max="10" oninput="validarYSumar()">
      <label for="c6" class="label__criterio">(0-10)</label>
    </div>
  </div>

  <div class="derecha">
    <h2>Puntaje Total</h2>
    <div class="cuadro_total" id="total_puntaje">0</div>
    <button type="submit" id="boton_confirmar">Confirmar</button>
  </div>
</form>

<script>
  function validarYSumar() {
    const inputs = [
      { id: 'c1', max: 10 },
      { id: 'c2', max: 10 },
      { id: 'c3', max: 10 },
      { id: 'c4', max: 5 },
      { id: 'c5', max: 5 },
      { id: 'c6', max: 10 },
    ];

    let total = 0;

    inputs.forEach(input => {
      const el = document.getElementById(input.id);
      let val = parseFloat(el.value);
      
      if (isNaN(val)) val = 0;

      if (val < 0) {
        el.value = 0;
        val = 0;
      } else if (val > input.max) {
        el.value = input.max;
        val = input.max;
      }

      total += val;
    });

    document.getElementById("total_puntaje").textContent = total;
  }
</script>
