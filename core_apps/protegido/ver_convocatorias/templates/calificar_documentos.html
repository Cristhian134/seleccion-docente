<form method="post" class="contenido">
  {% csrf_token %}
  <div class="cuadro_criterios">
    <div class="item__cuadro">
      <h3>Grados Académicos y Títulos Profesionales</h3>
      <input type="number" id="cd1" name="cd1" min="0" max="10" oninput="validarYSumar()">
      <label for="cd1" class="label__criterio">(0-10)</label>
    </div>
    <div class="item__cuadro">
      <h3>Investigación</h3>
      <input type="number" id="cd2" name="cd2" min="0" max="10" oninput="validarYSumar()">
      <label for="cd2" class="label__criterio">(0-10)</label>
    </div>
    <div class="item__cuadro">
      <h3>Enseñanza</h3>
      <input type="number" id="cd3" name="cd3" min="0" max="10" oninput="validarYSumar()">
      <label for="cd3" class="label__criterio">(0-10)</label>
    </div>
    <div class="item__cuadro">
      <h3>Capacitación Académica</h3>
      <input type="number" id="cd4" name="cd4" min="0" max="5" oninput="validarYSumar()">
      <label for="cd4" class="label__criterio">(0-5)</label>
    </div>
    <div class="item__cuadro">
      <h3>Proyección Social</h3>
      <input type="number" id="cd5" name="cd5" min="0" max="5" oninput="validarYSumar()">
      <label for="cd5" class="label__criterio">(0-5)</label>
    </div>
    <div class="item__cuadro">
      <h3>Ejercicio Profesional</h3>
      <input type="number" id="cd6" name="cd6" min="0" max="10" oninput="validarYSumar()">
      <label for="cd6" class="label__criterio">(0-10)</label>
    </div>
  </div>

  <div class="derecha">
    <h2>Puntaje Total</h2>
    <div class="cuadro_total" id="total_puntaje">0</div>
    <button type="submit" id="boton_confirmar">Confirmar</button>
  </div>
</form>

<script>
  function validarYSumar() {
    const inputs = [
      { id: 'cd1', max: 10 },
      { id: 'cd2', max: 10 },
      { id: 'cd3', max: 10 },
      { id: 'cd4', max: 5 },
      { id: 'cd5', max: 5 },
      { id: 'cd6', max: 10 },
    ];

    let total = 0;

    inputs.forEach(input => {
      const el = document.getElementById(input.id);
      let val = parseFloat(el.value);
      
      if (isNaN(val)) val = 0;

      if (val < 0) {
        el.value = 0;
        val = 0;
      } else if (val > input.max) {
        el.value = input.max;
        val = input.max;
      }

      total += val;
    });

    document.getElementById("total_puntaje").textContent = total;
  }
</script>
