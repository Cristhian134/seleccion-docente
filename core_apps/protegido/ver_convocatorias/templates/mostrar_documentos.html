{% extends "base.html" %} 
{% load static %} 
{% block content %}

<ol class="breadcrumb__list">
  <li class="breadcrumb__item"><a href="/home">Inicio</a></li>
  <li class="breadcrumb__item"><a href="/ver_convocatorias/">Ver convocatoria</a></li>
  <li class="breadcrumb__item">
    <a href="{% url 'dirigir_calificacion' convocatoria_id %}">Dirigir Calificación</a>
  </li>
  <li class="breadcrumb__item"><a>Documentos</a></li>
</ol>

<div class="reales__documentos">
  <div class="seleccion__documento">
    <span class="caja__documentos">Documentos</span>
    <form id="form__documentos">
      {% for d in documentos %}
        <div class="fila__documento">
          <label>
            <input type="radio" name="documento" data-url="{% url 'ver_documento' d.id %}">
            {{ d.tipoDocumento }}
          </label>
        </div>
      {% empty %}
        <p>No hay documentos subidos.</p>
      {% endfor %}
    </form>
  </div>

  <div class="mostrar__documento">
    Aquí mostrar el documento
  </div>
</div>

<button id="boton__calificar" data-url="{% url 'calificar_documentos' postulante_id %}">Calificar</button>

<div id="modalCalificar" class="modal" style="display:none;">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div id="contenidoModal"></div>
  </div>
</div>

<script>
  document.querySelectorAll('input[name="documento"]').forEach(radio => {
    radio.addEventListener('change', function() {
      const url = this.dataset.url;
      document.querySelector('.mostrar__documento').innerHTML = `
        <iframe src="${url}" width="100%" height="600px" frameborder="0"></iframe>
      `;
    });
  });
</script>

<script>
document.getElementById('boton__calificar').addEventListener('click', function() {
  const url = this.dataset.url;

  fetch(url)
    .then(response => response.text())
    .then(html => {
      document.getElementById('contenidoModal').innerHTML = html;
      document.getElementById('modalCalificar').style.display = 'block';
    });
});

document.querySelector('.close').addEventListener('click', function() {
  document.getElementById('modalCalificar').style.display = 'none';
});
</script>

<script>
  function validarYSumar() {
    const inputs = [
      { id: 'cd1', max: 10 },
      { id: 'cd2', max: 10 },
      { id: 'cd3', max: 10 },
      { id: 'cd4', max: 5 },
      { id: 'cd5', max: 5 },
      { id: 'cd6', max: 10 },
    ];

    let total = 0;

    inputs.forEach(input => {
      const el = document.getElementById(input.id);
      let val = parseFloat(el.value);
      
      if (isNaN(val)) val = 0;

      if (val < 0) {
        el.value = 0;
        val = 0;
      } else if (val > input.max) {
        el.value = input.max;
        val = input.max;
      }

      total += val;
    });

    document.getElementById("total_puntaje").textContent = total;
  }
</script>

{% endblock %}
