{% extends "base.html" %} {% load static %} {% block content %}

<ol class="breadcrumb__list">
    <li class="breadcrumb__item">
      <a href="/home">Inicio</a>
    </li>
    <li class="breadcrumb__item">
      <a href="/ver_convocatoria">Ver convocatoria</a>
    </li>
    <li class="breadcrumb__item">
      <a href="/dirigir_calificacion">Digir Calificación</a>
    </li>
    <li class="breadcrumb__item">
      <a>Documentos</a>
    </li>
</ol>

<div class="reales__documentos">
  <div class="seleccion__documento">
    <span class="caja__documentos">Documentos</span>
    {{% for documento in documentos %}}
      <div class="fila__documento">
        <span> {{ documento.nombre }}</span>
        <input type="radio" name="nombre_doc" value="{{ documento.id }}">
      </div>
  </div>
  <div class="mostrar__documento">
    <div class="mostrar__documento documento_pdf">VEREMOS XDDDDDDDDDDDDDDDDDDD</div>
  </div>
</div>

<button id="boton__calificar">Calificar</button>

{% endblock %}
